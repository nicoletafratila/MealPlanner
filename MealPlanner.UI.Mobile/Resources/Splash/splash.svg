<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#512BD4" />
  <!-- Letter "M" as path geometry, deliberately NOT an SVG text element: text makes MAUI's
       GenerateSplashAssets task run HarfBuzz font shaping, which crashes on this machine with a
       HarfBuzzSharp MissingMethodException (mismatched SkiaSharp/HarfBuzzSharp versions in the
       MSBuild worker). Path geometry renders identically and never invokes font shaping. -->
  <path fill="white" d="M 36 82 L 36 34 L 47 34 L 64 62 L 81 34 L 92 34 L 92 82 L 81 82 L 81 52 L 68 74 L 60 74 L 47 52 L 47 82 Z" />
</svg>
